<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Anya's Pop Game ✨</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: linear-gradient(180deg, #4FC3F7 0%, #81D4FA 30%, #B3E5FC 65%, #E1F5FE 100%);
    }

    #bg-sun {
      position: fixed;
      top: 24px;
      right: 28px;
      font-size: 70px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      animation: sun-spin 20s linear infinite;
      opacity: 0.85;
      z-index: 0;
    }
    @keyframes sun-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .cloud {
      position: fixed;
      pointer-events: none;
      user-select: none;
      font-size: 80px;
      line-height: 1;
      opacity: 0.55;
      z-index: 0;
      animation: cloud-drift linear infinite;
      white-space: nowrap;
    }
    @keyframes cloud-drift {
      from { transform: translateX(0); }
      to   { transform: translateX(110vw); }
    }

    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      z-index: 1;
    }

    .obj {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .confetti {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      will-change: transform, opacity;
      border-radius: 3px;
    }

    #yay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #yay.show { opacity: 1; }

    #yay-text {
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 13vw, 110px);
      text-align: center;
      line-height: 1.15;
      background: linear-gradient(90deg,
        #FF6B6B 0%, #FFE66D 20%, #6BCB77 40%,
        #4D96FF 60%, #C77DFF 80%, #FF6B6B 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
      animation: yay-bounce 0.55s ease-in-out infinite alternate,
                 yay-shimmer 2s linear infinite;
    }
    @keyframes yay-bounce {
      from { transform: scale(1)    rotate(-2deg); }
      to   { transform: scale(1.07) rotate( 2deg); }
    }
    @keyframes yay-shimmer {
      from { background-position: 0% center; }
      to   { background-position: 200% center; }
    }

    #hint {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      z-index: 5;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hint.hide { opacity: 0; }
    #hint-emoji { font-size: 90px; animation: hint-bob 1.2s ease-in-out infinite alternate; }
    @keyframes hint-bob {
      from { transform: translateY(0); }
      to   { transform: translateY(-18px); }
    }
    #hint-arrow {
      font-size: 50px;
      animation: hint-bob 1.2s ease-in-out 0.3s infinite alternate;
    }
  </style>
</head>
<body>

<div id="bg-sun">☀️</div>
<div class="cloud" style="top:8%;  left:-120px; animation-duration:35s; font-size:90px;">☁️</div>
<div class="cloud" style="top:18%; left:-120px; animation-duration:52s; animation-delay:-18s; font-size:60px;">☁️</div>
<div class="cloud" style="top:6%;  left:-120px; animation-duration:44s; animation-delay:-30s; font-size:75px;">☁️</div>

<div id="game"></div>
<div id="yay"><div id="yay-text">🌈 Yay Anya! 🌈</div></div>

<div id="hint">
  <div id="hint-emoji">🎈</div>
  <div id="hint-arrow">👇</div>
</div>

<script>
'use strict';

const MAX_ON_SCREEN   = 5;
const HIT_EXTRA       = 50;
const SPAWN_MS_MIN    = 1600;
const SPAWN_MS_MAX    = 3000;
const WOBBLE_AMP      = 38;
const WOBBLE_FREQ     = 0.017;
const FLOAT_PCT_MIN   = 0.055;
const FLOAT_PCT_MAX   = 0.085;
const RAINBOW_PROB    = 0.13;
const YAY_DURATION_MS = 2800;
const CONFETTI_COUNT  = 22;
const CONFETTI_BIG    = 48;

const CONFETTI_COLORS = [
  '#FF6B6B','#FF8E53','#FFE66D','#6BCB77',
  '#4D96FF','#C77DFF','#FF6EB4','#FFC3A0',
  '#B5EAD7','#C7CEEA','#FFDAC1','#E2F0CB',
];

const POOL = [
  { e:'🎈', sz:90,  hues:[0,  60, 120, 180, 240, 300] },
  { e:'⭐',  sz:82,  hues:null },
  { e:'🌟',  sz:82,  hues:null },
  { e:'🦋',  sz:90,  hues:[0, 60, 180] },
  { e:'🐱',  sz:88,  hues:null },
  { e:'🐥',  sz:84,  hues:null },
  { e:'🐸',  sz:84,  hues:null },
  { e:'🌸',  sz:82,  hues:[0, 60, 200, 300] },
  { e:'❤️',  sz:80,  hues:[0, 40, 300] },
  { e:'🐰',  sz:88,  hues:null },
  { e:'🍭',  sz:84,  hues:[0, 120, 240] },
  { e:'🐠',  sz:86,  hues:null },
];

const gameEl   = document.getElementById('game');
const yayEl    = document.getElementById('yay');
const hintEl   = document.getElementById('hint');

let objects      = [];
let nextSpawnAt  = 300;
let audioCtx     = null;
let firstTap     = true;
let yayTimer     = null;
let raf          = null;

function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  } catch (_) { audioCtx = null; }
}

function masterGain() {
  const g = audioCtx.createGain();
  g.gain.value = 0.28;
  g.connect(audioCtx.destination);
  return g;
}

function playPop() {
  if (!audioCtx) return;
  const t  = audioCtx.currentTime;
  const mg = masterGain();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(mg);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(340 + Math.random() * 160, t);
  osc.frequency.exponentialRampToValueAtTime(60, t + 0.16);
  gain.gain.setValueAtTime(1, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  osc.start(t); osc.stop(t + 0.2);
  const osc2  = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.connect(gain2); gain2.connect(mg);
  osc2.type = 'sine';
  osc2.frequency.value = 1200 + Math.random() * 400;
  gain2.gain.setValueAtTime(0.3, t);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc2.start(t); osc2.stop(t + 0.12);
}

function playRainbow() {
  if (!audioCtx) return;
  const t  = audioCtx.currentTime;
  const mg = masterGain();
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(mg);
    osc.type = 'triangle';
    const s = t + i * 0.13;
    osc.frequency.setValueAtTime(freq, s);
    gain.gain.setValueAtTime(0, s);
    gain.gain.linearRampToValueAtTime(0.7, s + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, s + 0.38);
    osc.start(s); osc.stop(s + 0.42);
  });
  [523.25, 659.25, 783.99].forEach(freq => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(mg);
    osc.type = 'sine';
    const s = t + notes.length * 0.13;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.4, s);
    gain.gain.exponentialRampToValueAtTime(0.001, s + 0.7);
    osc.start(s); osc.stop(s + 0.75);
  });
}

function burst(cx, cy, count) {
  for (let i = 0; i < count; i++) {
    const el   = document.createElement('div');
    el.className = 'confetti';
    const sz   = 7 + Math.random() * 10;
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const round = Math.random() > 0.4;
    el.style.cssText =
      `width:${sz}px;height:${sz}px;` +
      `background:${color};` +
      `border-radius:${round ? '50%' : '3px'};` +
      `transform:translate(${cx - sz/2}px,${cy - sz/2}px);`;
    gameEl.appendChild(el);
    const angle  = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 1.1;
    const dist   = 70 + Math.random() * 120;
    const dx     = Math.cos(angle) * dist;
    const dy     = Math.sin(angle) * dist - 55;
    const dur    = 550 + Math.random() * 350;
    el.animate([
      { transform: `translate(${cx - sz/2}px, ${cy - sz/2}px) scale(1) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${cx - sz/2 + dx}px, ${cy - sz/2 + dy}px) scale(0.2) rotate(${180 + Math.random()*360}deg)`, opacity: 0 },
    ], { duration: dur, easing: 'cubic-bezier(0,.6,.6,1)', fill: 'forwards' })
      .onfinish = () => el.remove();
  }
}

function showYay() {
  clearTimeout(yayTimer);
  yayEl.classList.add('show');
  for (let v = 0; v < 6; v++) {
    setTimeout(() => {
      burst(Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.7, 16);
    }, v * 180);
  }
  yayTimer = setTimeout(() => yayEl.classList.remove('show'), YAY_DURATION_MS);
}

function spawnOne() {
  if (objects.length >= MAX_ON_SCREEN) return;
  const W = window.innerWidth;
  const H = window.innerHeight;
  const isRainbow = Math.random() < RAINBOW_PROB;
  let emoji, sz, hueFilter;
  if (isRainbow) {
    emoji = '🌈'; sz = 100; hueFilter = '';
  } else {
    const tpl = POOL[Math.floor(Math.random() * POOL.length)];
    emoji = tpl.e; sz = tpl.sz;
    hueFilter = (tpl.hues && tpl.hues.length)
      ? `hue-rotate(${tpl.hues[Math.floor(Math.random() * tpl.hues.length)]}deg)` : '';
  }
  const margin  = sz / 2 + WOBBLE_AMP + 4;
  const baseX   = margin + Math.random() * Math.max(0, W - margin * 2);
  const startY  = H + sz;
  const el = document.createElement('div');
  el.className = 'obj';
  el.style.cssText =
    `width:${sz}px;height:${sz}px;` +
    `font-size:${Math.round(sz * 0.88)}px;` +
    (hueFilter ? `filter:${hueFilter};` : '') +
    (isRainbow ? 'filter:drop-shadow(0 0 14px rgba(255,210,0,0.9));' : '');
  el.textContent = emoji;
  gameEl.appendChild(el);
  const speed = (H * (FLOAT_PCT_MIN + Math.random() * (FLOAT_PCT_MAX - FLOAT_PCT_MIN))) / 60;
  objects.push({ el, x: baseX, y: startY, sz, speed, wobblePhase: Math.random() * Math.PI * 2, baseX, rainbow: isRainbow, alive: true });
}

function popObject(obj, tapX, tapY) {
  if (!obj.alive) return;
  obj.alive = false;
  objects = objects.filter(o => o !== obj);
  ensureAudio();
  if (obj.rainbow) { playRainbow(); showYay(); burst(tapX, tapY, CONFETTI_BIG); }
  else { playPop(); burst(tapX, tapY, CONFETTI_COUNT); }
  const tx = obj.x - obj.sz / 2;
  const ty = obj.y - obj.sz / 2;
  obj.el.animate([
    { transform: `translate(${tx}px,${ty}px) scale(1)`,   opacity: 1 },
    { transform: `translate(${tx}px,${ty}px) scale(1.7)`, opacity: 0.7, offset: 0.35 },
    { transform: `translate(${tx}px,${ty}px) scale(0.05)`,opacity: 0 },
  ], { duration: 320, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' })
    .onfinish = () => obj.el.remove();
}

function tryHit(tx, ty) {
  let best = null, bestDist = Infinity;
  for (const obj of objects) {
    if (!obj.alive) continue;
    const r  = obj.sz / 2 + HIT_EXTRA;
    const dx = tx - obj.x;
    const dy = ty - obj.y;
    const d  = Math.sqrt(dx * dx + dy * dy);
    if (d <= r && d < bestDist) { best = obj; bestDist = d; }
  }
  if (best) popObject(best, tx, ty);
}

function loop(ts) {
  const H = window.innerHeight;
  if (ts >= nextSpawnAt) {
    spawnOne();
    nextSpawnAt = ts + SPAWN_MS_MIN + Math.random() * (SPAWN_MS_MAX - SPAWN_MS_MIN);
  }
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y -= obj.speed;
    obj.wobblePhase += WOBBLE_FREQ;
    obj.x = obj.baseX + Math.sin(obj.wobblePhase) * WOBBLE_AMP;
    if (obj.y < -obj.sz * 1.5) { obj.el.remove(); objects.splice(i, 1); continue; }
    const pulse = 1 + 0.025 * Math.sin(obj.wobblePhase * 1.7);
    obj.el.style.transform = `translate(${obj.x - obj.sz/2}px,${obj.y - obj.sz/2}px) scale(${pulse})`;
  }
  raf = requestAnimationFrame(loop);
}

document.addEventListener('touchstart', e => {
  e.preventDefault();
  if (firstTap) { firstTap = false; hintEl.classList.add('hide'); setTimeout(() => hintEl.remove(), 700); ensureAudio(); }
  for (let i = 0; i < e.changedTouches.length; i++) tryHit(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
}, { passive: false });

document.addEventListener('mousedown', e => {
  e.preventDefault();
  if (firstTap) { firstTap = false; hintEl.classList.add('hide'); setTimeout(() => hintEl.remove(), 700); ensureAudio(); }
  tryHit(e.clientX, e.clientY);
}, { passive: false });

document.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
document.addEventListener('touchend',   e => e.preventDefault(), { passive: false });
document.addEventListener('touchcancel',e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', () => {
  objects.forEach(o => o.el.remove());
  objects = [];
  nextSpawnAt = 0;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
